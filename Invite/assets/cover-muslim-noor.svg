<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-noor" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0b3829"/>
      <stop offset="60%" stop-color="#041a13"/>
      <stop offset="100%" stop-color="#020d09"/>
    </radialGradient>
    <linearGradient id="gold-noor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5c158"/>
      <stop offset="50%" stop-color="#fae19c"/>
      <stop offset="100%" stop-color="#b58a1f"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" fill="url(#bg-noor)"/>
  <rect x="14" y="14" width="272" height="372" rx="14" fill="none" stroke="url(#gold-noor)" stroke-width="1.5" stroke-opacity="0.7"/>
  <!-- Pointed Mughal Mehrab Arch -->
  <path d="M40 210 L40 340 L260 340 L260 210 C260 140, 200 90, 150 55 C100 90, 40 140, 40 210 Z" fill="none" stroke="url(#gold-noor)" stroke-width="1.8"/>
  <path d="M52 215 L52 330 L248 330 L248 215 C248 150, 195 105, 150 72 C105 105, 52 150, 52 215 Z" fill="none" stroke="url(#gold-noor)" stroke-width="0.8" stroke-dasharray="4,2" stroke-opacity="0.45"/>
  <!-- Bismillah Calligraphy -->
  <text x="150" y="125" font-family="Traditional Arabic, 'Amiri', serif" font-size="20" fill="url(#gold-noor)" text-anchor="middle">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</text>
  <!-- Islamic Crescent & Star Motif -->
  <g transform="translate(150, 170)" stroke="url(#gold-noor)" stroke-width="1.2" fill="none">
    <circle cx="0" cy="0" r="14" stroke-opacity="0.4"/>
    <path d="M4 -8 A 10 10 0 1 0 4 8 A 8 8 0 1 1 4 -8 Z" fill="url(#gold-noor)"/>
    <polygon points="6,-1 7.5,-4 9,-1 12,-1 9.5,1 10.5,4 8,2 5.5,4 6.5,1 4,-1" fill="url(#gold-noor)"/>
  </g>
  <text x="150" y="225" font-family="'Cinzel', Georgia, serif" font-size="15" fill="#f4fbf7" font-weight="700" text-anchor="middle" letter-spacing="2">NOOR-E-JANNAT</text>
  <text x="150" y="246" font-family="'Playfair Display', Georgia, serif" font-size="11" fill="url(#gold-noor)" text-anchor="middle" letter-spacing="3">EMERALD &amp; GOLD FOIL</text>
  <line x1="80" y1="262" x2="220" y2="262" stroke="url(#gold-noor)" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="150" y="280" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="11" fill="#cde2d6" text-anchor="middle">Royal Shadi &amp; Nikah Celebration</text>
  <text x="150" y="315" font-family="'Cinzel', Georgia, serif" font-size="8" fill="url(#gold-noor)" text-anchor="middle" letter-spacing="3">SHADI CARD EDITION</text>
</svg>