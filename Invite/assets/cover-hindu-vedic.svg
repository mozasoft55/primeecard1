<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-vedic" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4a0817"/>
      <stop offset="60%" stop-color="#24040b"/>
      <stop offset="100%" stop-color="#0e0104"/>
    </radialGradient>
    <linearGradient id="gold-foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c59b27"/>
      <stop offset="30%" stop-color="#fae19c"/>
      <stop offset="60%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa7c11"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" fill="url(#bg-vedic)"/>
  <!-- Ornate Border -->
  <rect x="14" y="14" width="272" height="372" rx="14" fill="none" stroke="url(#gold-foil)" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="20" y="20" width="260" height="360" rx="10" fill="none" stroke="url(#gold-foil)" stroke-width="0.8" stroke-dasharray="4,3" stroke-opacity="0.4"/>
  <!-- Corner Motifs -->
  <circle cx="20" cy="20" r="4" fill="url(#gold-foil)"/>
  <circle cx="280" cy="20" r="4" fill="url(#gold-foil)"/>
  <circle cx="20" cy="380" r="4" fill="url(#gold-foil)"/>
  <circle cx="280" cy="380" r="4" fill="url(#gold-foil)"/>
  <!-- Temple Mandap Arch -->
  <path d="M40 180 C40 100, 100 55, 150 55 C200 55, 260 100, 260 180 L260 330 C260 340, 250 350, 240 350 L60 350 C50 350, 40 340, 40 330 Z" fill="none" stroke="url(#gold-foil)" stroke-width="1.8"/>
  <path d="M52 185 C52 115, 105 72, 150 72 C195 72, 248 115, 248 185 L248 335 L52 335 Z" fill="none" stroke="url(#gold-foil)" stroke-width="0.75" stroke-opacity="0.5"/>
  <!-- Top Invocation -->
  <text x="150" y="115" font-family="'Cinzel', Georgia, serif" font-size="13" fill="url(#gold-foil)" font-weight="700" text-anchor="middle" letter-spacing="3">|| श्री श्री गणेशाय नमः ||</text>
  <!-- Sacred Kalash / Diya Motif -->
  <g transform="translate(150, 160)" stroke="url(#gold-foil)" stroke-width="1.2" fill="none">
    <circle cx="0" cy="0" r="16" stroke-width="1"/>
    <path d="M-10 10 C-12 -2, 12 -2, 10 10 Z" fill="url(#gold-foil)" fill-opacity="0.3"/>
    <path d="M0 -16 C-4 -6, 4 -6, 0 -16 Z" fill="url(#gold-foil)"/>
    <circle cx="0" cy="0" r="4" fill="url(#gold-foil)"/>
  </g>
  <!-- Typography Snippet -->
  <text x="150" y="225" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="15" fill="#fff7eb" font-weight="700" text-anchor="middle" letter-spacing="2">RAJMAHAL VEDIC</text>
  <text x="150" y="246" font-family="'Cormorant Garamond', Georgia, serif" font-size="11" fill="url(#gold-foil)" text-anchor="middle" letter-spacing="4">CRIMSON &amp; GOLD</text>
  <line x1="80" y1="262" x2="220" y2="262" stroke="url(#gold-foil)" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="150" y="280" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="11" fill="#e9cfa6" text-anchor="middle">Auspicious Vedic Vivah</text>
  <text x="150" y="315" font-family="'Cinzel', Georgia, serif" font-size="8" fill="url(#gold-foil)" text-anchor="middle" letter-spacing="3">ROYAL INVITATION</text>
</svg>