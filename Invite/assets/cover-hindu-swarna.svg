<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-swarna" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#24121d"/>
      <stop offset="50%" stop-color="#12080f"/>
      <stop offset="100%" stop-color="#050204"/>
    </radialGradient>
    <linearGradient id="gold-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="35%" stop-color="#fff8d6"/>
      <stop offset="65%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#997a1f"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" fill="url(#bg-swarna)"/>
  <!-- Pure 24K Gold Leaf Embossed Borders -->
  <rect x="14" y="14" width="272" height="372" rx="16" fill="none" stroke="url(#gold-leaf)" stroke-width="2" stroke-opacity="0.85"/>
  <rect x="20" y="20" width="260" height="360" rx="12" fill="none" stroke="url(#gold-leaf)" stroke-width="0.8" stroke-dasharray="2,3" stroke-opacity="0.6"/>
  <!-- Corner Gems -->
  <circle cx="20" cy="20" r="4.5" fill="url(#gold-leaf)"/>
  <circle cx="280" cy="20" r="4.5" fill="url(#gold-leaf)"/>
  <circle cx="20" cy="380" r="4.5" fill="url(#gold-leaf)"/>
  <circle cx="280" cy="380" r="4.5" fill="url(#gold-leaf)"/>
  <!-- Sholapith Topor & Mukut Zenith Crest -->
  <g transform="translate(150, 85)" fill="url(#gold-leaf)" stroke="url(#gold-leaf)">
    <!-- Topor peak -->
    <polygon points="0,-22 9,-2 -9,-2" stroke-width="0.8"/>
    <circle cx="0" cy="-24" r="2.5"/>
    <!-- Mukut arc -->
    <path d="M-22 4 C-10 -4, 10 -4, 22 4 L18 8 L-18 8 Z" stroke-width="0.8"/>
    <circle cx="-16" cy="0" r="2"/>
    <circle cx="0" cy="-2" r="2.5"/>
    <circle cx="16" cy="0" r="2"/>
  </g>
  <!-- Architectural Portal -->
  <path d="M46 195 C46 130, 95 90, 150 90 C205 90, 254 130, 254 195 L254 335 L46 335 Z" fill="none" stroke="url(#gold-leaf)" stroke-width="1.8"/>
  <path d="M58 200 C58 140, 100 102, 150 102 C200 102, 242 140, 242 200 L242 325 L58 325 Z" fill="none" stroke="url(#gold-leaf)" stroke-width="0.7" stroke-dasharray="4,2" stroke-opacity="0.5"/>
  <!-- Shloka text -->
  <text x="150" y="140" font-family="'Cinzel', Georgia, serif" font-size="10.5" fill="url(#gold-leaf)" font-weight="700" text-anchor="middle" letter-spacing="1">|| যদেতদ্ হৃদয়ং তব তদেতদ্ হৃদয়ং মম ||</text>
  <!-- Crown Seal -->
  <g transform="translate(150, 175)" stroke="url(#gold-leaf)" stroke-width="1.2" fill="none">
    <circle cx="0" cy="0" r="17"/>
    <circle cx="0" cy="0" r="13" stroke-dasharray="2,2"/>
    <polygon points="0,-8 5,0 0,8 -5,0" fill="url(#gold-leaf)"/>
  </g>
  <!-- Typography -->
  <text x="150" y="224" font-family="'Cinzel', Georgia, serif" font-size="15" fill="#FFF7ED" font-weight="700" text-anchor="middle" letter-spacing="2">SWARNA MUKUT</text>
  <text x="150" y="245" font-family="'Cinzel', Georgia, serif" font-size="11" fill="url(#gold-leaf)" text-anchor="middle" letter-spacing="3">&amp; TOPOR NOIR</text>
  <line x1="80" y1="260" x2="220" y2="260" stroke="url(#gold-leaf)" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="150" y="280" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="12" fill="#e6d1b8" text-anchor="middle">Regal Obsidian Noir &amp; 24K Sholapith</text>
  <text x="150" y="315" font-family="'Cinzel', Georgia, serif" font-size="8.5" fill="url(#gold-leaf)" text-anchor="middle" letter-spacing="3">ROYAL INVITATION</text>
</svg>

