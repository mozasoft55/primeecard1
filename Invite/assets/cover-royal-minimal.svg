<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-minimal" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#36152a"/>
      <stop offset="60%" stop-color="#190713"/>
      <stop offset="100%" stop-color="#0a0107"/>
    </radialGradient>
    <linearGradient id="gold-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a882"/>
      <stop offset="50%" stop-color="#ffd5be"/>
      <stop offset="100%" stop-color="#bf7750"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" fill="url(#bg-minimal)"/>
  <rect x="14" y="14" width="272" height="372" rx="14" fill="none" stroke="url(#gold-rose)" stroke-width="1.2" stroke-opacity="0.6"/>
  <!-- Minimalist Geometric Arch -->
  <path d="M50 160 C50 100, 95 60, 150 60 C205 60, 250 100, 250 160 L250 330 L50 330 Z" fill="none" stroke="url(#gold-rose)" stroke-width="1.5"/>
  <!-- Floating Starburst Motif -->
  <g transform="translate(150, 135)" stroke="url(#gold-rose)" stroke-width="1" fill="none">
    <line x1="0" y1="-14" x2="0" y2="14"/>
    <line x1="-14" y1="0" x2="14" y2="0"/>
    <line x1="-9" y1="-9" x2="9" y2="9"/>
    <line x1="-9" y1="9" x2="9" y2="-9"/>
    <circle cx="0" cy="0" r="3" fill="url(#gold-rose)"/>
  </g>
  <text x="150" y="210" font-family="'Cinzel', Georgia, serif" font-size="11" fill="url(#gold-rose)" font-weight="700" text-anchor="middle" letter-spacing="4">MODERN MINIMAL</text>
  <text x="150" y="235" font-family="'Playfair Display', Georgia, serif" font-size="16" fill="#fcf5f9" font-weight="700" text-anchor="middle" letter-spacing="2">CELESTIAL GATE</text>
  <text x="150" y="254" font-family="'Cormorant Garamond', Georgia, serif" font-size="11" fill="url(#gold-rose)" text-anchor="middle" letter-spacing="3">AMETHYST &amp; ROSE GOLD</text>
  <line x1="90" y1="268" x2="210" y2="268" stroke="url(#gold-rose)" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="150" y="286" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="11" fill="#e4c6d9" text-anchor="middle">Contemporary Editorial Luxe</text>
  <text x="150" y="315" font-family="'Cinzel', Georgia, serif" font-size="8" fill="url(#gold-rose)" text-anchor="middle" letter-spacing="3">PREMIUM EDITION</text>
</svg>